<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wunna — Application Submitted</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="favicon.png" />
<meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #07080c;
      --card: #12141b;
      --border: #2a2f3a;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --green: #34d399;
      --green-2: #059669;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 450px at 20% 0%, rgba(52,211,153,.14), transparent 55%),
        radial-gradient(700px 400px at 90% 20%, rgba(96,165,250,.12), transparent 50%),
        var(--bg);
      padding: 1.5rem;
    }
    .box {
      width: min(440px, 100%);
      text-align: center;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 18px;
      padding: 2.1rem 1.4rem 1.6rem;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }
    .check {
      width: 56px;
      height: 56px;
      margin: 0 auto .9rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(52,211,153,.25), rgba(5,150,105,.2));
      border: 1px solid rgba(52,211,153,.35);
      font-size: 1.5rem;
      animation: pop .45s ease;
    }
    @keyframes pop {
      from { transform: scale(.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 .55rem;
      letter-spacing: -.02em;
    }
    p {
      color: var(--muted);
      margin: 0 0 .85rem;
      line-height: 1.55;
      font-size: .98rem;
    }
    .highlight {
      color: #e5e7eb;
      font-weight: 500;
    }
    a.btn {
      display: inline-block;
      margin-top: .4rem;
      color: #04140d;
      background: linear-gradient(135deg, var(--green), var(--green-2));
      text-decoration: none;
      font-weight: 600;
      border-radius: 999px;
      padding: .75rem 1.2rem;
    }
    a.btn:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <div class="box">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Application submitted successfully</h1>
    <p class="highlight">A message would be sent out to you in a short while.</p>
    <p>Please keep your WhatsApp, iMessage, and Telegram available for follow-up.</p>
    <a class="btn" href="index.html">Back to home</a>
  </div>
</body>
</html>
